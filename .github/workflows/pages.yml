name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - name: Build
        env:
          HUB_URL: https://mmcconservador-svg.github.io/guia-pr-tico-de-nutri-o-na-terapia-com-tirzepatida/painel.html
        run: |
          npm run build:web
          cp dist/web/guia.html dist/web/index.html
          touch dist/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v4
